name: protein_cluster
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.10
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - biopython
  - tqdm
  - pip

  # External tools (Linux). Recommended:
  - tmalign

  # Optional (uncomment if you need them):
  # - dssp        # provides mkdssp; needed if you run with --ss dssp
  # - foldseek    # optional acceleration/pre-clustering
